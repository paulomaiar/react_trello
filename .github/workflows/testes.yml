name: Testes do Front-end

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testes-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
